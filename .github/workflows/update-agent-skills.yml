name: Update agent skills

on:
  workflow_dispatch:
  # schedule:
    # - cron: "23 8 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-agent-skills
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dotfiles
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Update managed skills
        run: ./update-agent-skills

      - name: Check for updates
        id: changes
        run: |
          if git diff --quiet -- agents/.agents; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or refresh update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/update-agent-skills"
          remote_sha="$(git ls-remote --heads origin "$branch" | cut -f1)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git add agents/.agents/.skill-lock.json agents/.agents/skills
          git commit -m "chore(skills): update third-party skills"

          if [[ -n "$remote_sha" ]]; then
            git push --force-with-lease="refs/heads/$branch:$remote_sha" origin "HEAD:refs/heads/$branch"
          else
            git push origin "HEAD:refs/heads/$branch"
          fi

          if gh pr view "$branch" --json url >/dev/null 2>&1; then
            gh pr edit "$branch" --title "chore(skills): update third-party skills" --body-file - <<'EOF'
          Updates third-party agent skills recorded in `agents/.agents/.skill-lock.json`.

          Review these changes as executable agent instructions. In particular, check new tool permissions, scripts, external links, and source or licensing changes before merging.

          Generated by the `Update agent skills` workflow.
          EOF
          else
            gh pr create --base main --head "$branch" --title "chore(skills): update third-party skills" --body-file - <<'EOF'
          Updates third-party agent skills recorded in `agents/.agents/.skill-lock.json`.

          Review these changes as executable agent instructions. In particular, check new tool permissions, scripts, external links, and source or licensing changes before merging.

          Generated by the `Update agent skills` workflow.
          EOF
          fi